# Bradoku su Render: un solo servizio Node (API + frontend compilato) e un database Postgres.
databases:
  - name: bradoku-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16

services:
  - type: web
    name: bradoku
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bradoku-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
